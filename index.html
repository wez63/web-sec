            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;

            font-weight: 600;
            color: var(--primary-dark);

            margin: 0;
            display: flex;

            text-align: center;
            font-size: 1.3rem;
            border-radius: 10px;

    const tabsBar = document.getElementById('tabsBar');
    const contentSections = document.getElementById('contentSections');

    function buildQuiz() {
        completeDatabase.forEach((section, sIdx) => {
            // 1. توليد الأزرار العلوية للتبويبات
            const tabBtn = document.createElement('button');
            tabBtn.type = 'button';
            tabBtn.className = `tab-btn ${sIdx === 0 ? 'active' : ''}`;
            tabBtn.innerText = section.title;
            tabBtn.onclick = (e) => switchTab(sIdx, e.target);
            tabsBar.appendChild(tabBtn);

            // 2. توليد المحتوى (الأسئلة والخيارات)
            const secDiv = document.createElement('div');
            secDiv.className = `section-content ${sIdx === 0 ? 'active' : ''}`;
            secDiv.id = `sec-${sIdx}`;

            let html = `
                <div class="section-header">
                    <h2 class="section-title">${section.title}</h2>
                    <span class="question-count-badge">${section.questions.length} أسئلة</span>
                </div>
            `;

            section.questions.forEach((qObj, qIdx) => {
                let optionsHtml = '';
                qObj.opts.forEach((optText, oIdx) => {
                    optionsHtml += `
                        <li>
                            <label class="option-label" id="lbl-${sIdx}-${qIdx}-${oIdx}">
                                <input type="radio" name="q_${sIdx}_${qIdx}" value="${oIdx}">
                                <span>${optText}</span>
                            </label>
                        </li>
                    `;
                });

                html += `
                    <div class="question-card">
                        <div class="question-text">${qIdx + 1}. ${qObj.q}</div>
                        <ul class="options-group">
                            ${optionsHtml}
                        </ul>
                    </div>
                `;
            });

            // إضافة زر التسليم ومربع النتيجة لكل قسم
            html += `
                <div class="submit-area">
                    <button type="button" class="action-btn" onclick="gradeSection(${sIdx})">
                        تحقق من الإجابات (${section.title})
                    </button>
                    <div class="score-display" id="res-${sIdx}"></div>
                </div>
            `;

            secDiv.innerHTML = html;
            contentSections.appendChild(secDiv);
        });
    }

    function switchTab(targetIdx, clickedBtn) {
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            btn.classList.toggle('active', idx === targetIdx);
        });

        document.querySelectorAll('.section-content').forEach((sec, idx) => {
            sec.classList.toggle('active', idx === targetIdx);
        });

        clickedBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function gradeSection(sIdx) {
        const secData = completeDatabase[sIdx];
        let correctCount = 0;
        let missed = false;

        secData.questions.forEach((qObj, qIdx) => {
            const selected = document.querySelector(`input[name="q_${sIdx}_${qIdx}"]:checked`);
            
            // إزالة التنسيقات السابقة
            qObj.opts.forEach((_, oIdx) => {
                document.getElementById(`lbl-${sIdx}-${qIdx}-${oIdx}`).classList.remove('correct-answer', 'wrong-answer');
            });

            if (selected) {
                const userVal = parseInt(selected.value);
                if (userVal === qObj.ans) {
                    correctCount++;
                    document.getElementById(`lbl-${sIdx}-${qIdx}-${userVal}`).classList.add('correct-answer');
                } else {
                    document.getElementById(`lbl-${sIdx}-${qIdx}-${userVal}`).classList.add('wrong-answer');
                    // إظهار الصحيحة للمستخدم
                    document.getElementById(`lbl-${sIdx}-${qIdx}-${qObj.ans}`).classList.add('correct-answer');
                }
            } else {
                missed = true;
                document.getElementById(`lbl-${sIdx}-${qIdx}-${qObj.ans}`).classList.add('correct-answer');
            }
        });

        // عرض النتيجة
        const resBox = document.getElementById(`res-${sIdx}`);
        resBox.style.display = 'block';
        const total = secData.questions.length;
        const percent = Math.round((correctCount / total) * 100);

        if (percent >= 60) {
            resBox.style.backgroundColor = '#d1fae5';
            resBox.style.color = '#065f46';
            resBox.style.border = '2px solid #10b981';
            resBox.innerHTML = `✅ مبدع! نتيجتك: <strong>${correctCount} / ${total}</strong> (${percent}%)`;
        } else {
            resBox.style.backgroundColor = '#ffe4e6';
            resBox.style.color = '#9f1239';
            resBox.style.border = '2px solid #e11d48';
            resBox.innerHTML = `⚠️ نتيجتك: <strong>${correctCount} / ${total}</strong> (${percent}%) - يُرجى مراجعة الإجابات الصحيحة (بالأخضر).`;
        }

        if (missed) {
            resBox.innerHTML += `<br><span style="font-size:0.85rem; color:#475569; font-weight:normal;">(ملاحظة: هناك أسئلة لم تقم بالإجابة عليها)</span>`;
        }

        resBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    window.onload = buildQuiz;
</script>

</body>
</html>
